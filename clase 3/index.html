<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="css/pure-min.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="pure-g div-principal">
            <div class="pure-u-24-24 div-selector">
                <select id="miSelector">
                    <option style="font-size: large;" value="suma">Suma</option>
                    <option style="font-size: large;" value="resta">Resta</option>
                    <option style="font-size: large;" value="multiplicacion">Multiplicación</option>
                    <option style="font-size: large;" value="division">División</option>
                </select>
            </div>

            <div class="pure-u-11-24 div-numero-1">
                <input type="number" 
                       id="primerNumero" 
                       placeholder="Ingrese el primer número"
                />
            </div>
            <div class="pure-u-11-24 div-numero-2">
                <input type="number" 
                       id="segundoNumero" 
                       placeholder="Ingrese el segundo número"
                />
            </div>

            <div  class="pure-u-24-24 div-boton-calcular"><button id="miBoton">CALCULAR</button></div>

            <div id="resultado" class="pure-u-24-24 div-resultado">0</div>
        </div>
        <script src="js/main.js"></script>
    </body>
</html>
